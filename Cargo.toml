[package]
name = "phoros"
version = "0.1.0"
edition = "2021"
description = "Zero-allocation ring buffer with XOR delta encoding and state rollback"
license = "MIT"
repository = "https://github.com/Pivius/phoros"
keywords = ["ring-buffer", "undo", "rollback", "state", "no-std"]
categories = ["no-std", "data-structures"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "codec_bench"
harness = false

[[bench]]
name = "rollback_bench"
harness = false

[[bench]]
name = "snapshot_bench"
harness = false
